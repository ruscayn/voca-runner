# 공통 설정 = 운영 기준 값.
# 개발 PC 는 local 프로필(application-local.yaml)로 개발용 값만 덮어쓴다. (IntelliJ 실행 설정 Active profiles: local)
# 프로필을 지정하지 않으면 운영 값으로 동작한다.
spring:
  application:
    name: voca-runner

  config:
    import: classpath:secret.yml   # DB 계정 (git 제외 파일)

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 docs/output/schema.sql 로 관리. Entity 와 테이블 불일치 시 기동 실패. create / create-drop 사용 금지 (적재 데이터 삭제됨)
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # 결과 화면 등 연관 조회 N+1 방지

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:my_voca}
    driver-class-name: org.postgresql.Driver

  thymeleaf:
    cache: true               # 템플릿을 한 번만 읽음

  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true     # 정적 파일 주소에 내용 해시를 붙임 (test.js → test-<해시>.js). 파일이 바뀌면 주소도 바뀌어 브라우저가 새 파일을 받음
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d       # 해시 주소라 오래 캐시해도 안전
          cache-public: true

logging:
  level:
    root: INFO
    org.ruscayn.vocarunner: INFO

server:
  port: 8080
  compression:
    enabled: true             # 응답 gzip 압축 (브라우저가 Accept-Encoding 으로 지원을 알릴 때만). 결과 화면 HTML·문제 API 크기 감소
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json   # 글꼴(woff2)은 이미 압축 형식이라 제외
    min-response-size: 2KB    # 이보다 작은 응답은 압축하지 않음
  servlet:
    session:
      tracking-modes: cookie  # 세션은 쿠키로만. 첫 시작 때 주소에 ;jsessionid 가 붙지 않게 (U13)

voca-runner:
  site-url: https://vocarunner.com   # 사이트 전체 주소. 링크 미리보기 이미지(og:image)처럼 전체 주소가 필요한 곳에 씀 (U30)
  test:
    question-count: 500            # 0 이면 레벨 단어 전체 출제 (local 프로필에서 사용)
    grace: 3m                      # 마감 = (문항 수 × 제한 시간 + 여유 시간)을 분 단위로 올림. 500문항 → 45분
    result-retention: 2h           # 제출 후 결과 화면용 메모리 보관 시간 (결과 화면에 "HH:mm까지" 안내)
    max-in-progress: 20000         # 전체 동시 진행 상한 (500문항 1개 약 10KB → 약 200MB 이하)
    max-in-progress-per-ip: 50     # IP당 동시 진행 상한 (학교·통신사는 여러 사람이 IP 하나를 함께 씀. 쿠키를 지워 가며 만드는 것만 막음). 기기(쿠키)당은 1개, 새로 시작하면 이전 시험 종료
    # Nginx 등 프록시 뒤에 둘 때는 server.forward-headers-strategy 를 켜야 실제 사용자 IP 가 보인다 (안 켜면 모두 프록시 IP 하나로 50개 제한)
    cleanup-interval: 1m           # 끝난 시험 정리 주기
    undelivered-timeout: 5m        # 시작 후 이 시간 안에 문제를 받아 가지 않은 시험은 정리 (시작 직후 연결 끊김 등)
