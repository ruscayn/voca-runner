spring:
  application:
    name: my-voca

  config:
    import: classpath:secret.yml   # DB 계정 (git 제외 파일)

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 docs/output/schema.sql 로 관리. Entity 와 테이블 불일치 시 기동 실패. create / create-drop 사용 금지 (적재 데이터 삭제됨)
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # 결과 화면 등 연관 조회 N+1 방지

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:my_voca}
    driver-class-name: org.postgresql.Driver

  thymeleaf:
    cache: false

logging:
  level:
    root: INFO
    org.ruscayn.myvoca: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080

my-voca:
  test:
    question-count: 5   # 개발 테스트용. 실제 서비스는 500

