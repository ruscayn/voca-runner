<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- 공통 head : 글꼴(직접 제공) + 공통 스타일 -->
    <th:block th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#F7F8FA">
        <!-- 사이트 아이콘 (U15). svg = 요즘 브라우저 탭, ico = svg 를 못 읽는 곳, png = 홈 화면에 추가 -->
        <link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
        <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
        <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
        <!-- 링크 미리보기 (U30). 카톡·문자·SNS 가 읽어 카드로 보여 준다. 이미지는 전체 주소여야 해서 voca-runner.site-url 을 붙인다 -->
        <meta name="description" content="A1부터 C2까지, 지금 바로 확인해 보세요">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="VocaRunner">
        <meta property="og:title" content="내 영어 단어, 몇 레벨일까?">
        <meta property="og:description" content="A1부터 C2까지, 지금 바로 확인해 보세요">
        <meta property="og:image" th:content="${@environment.getProperty('voca-runner.site-url')} + @{/og-image.png}">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta name="twitter:card" content="summary_large_image">
        <link rel="stylesheet" th:href="@{/fonts/pretendard/pretendardvariable-dynamic-subset.css}">
        <link rel="stylesheet" th:href="@{/fonts/barlow/barlow.css}">
        <link rel="stylesheet" th:href="@{/css/main.css}">
    </th:block>
</head>
<body>

<!-- 로고 (책 표지에 달리는 사람 + 뒤쪽 줄무늬 + 글자). 파비콘(static/favicon.*)과 같은 그림 -->
<span class="brand" th:fragment="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><clipPath id="brand-mark-clip"><path d="M3 0H22.3A7 7 0 0 1 29.3 7V22.3A7 7 0 0 1 22.3 29.3H3A3 3 0 0 1 0 26.3V3A3 3 0 0 1 3 0Z"></path></clipPath></defs>
        <!-- 페이지 단면 = 표지와 같은 모양을 오른쪽 아래로 밀어 겹침 (뒤 표지, 종이) -->
        <path transform="translate(2.7 2.7)" d="M3 0H22.3A7 7 0 0 1 29.3 7V22.3A7 7 0 0 1 22.3 29.3H3A3 3 0 0 1 0 26.3V3A3 3 0 0 1 3 0Z" class="brand-mark-dark"></path>
        <path transform="translate(1.4 1.4)" d="M3 0H22.3A7 7 0 0 1 29.3 7V22.3A7 7 0 0 1 22.3 29.3H3A3 3 0 0 1 0 26.3V3A3 3 0 0 1 3 0Z" fill="#FFFFFF"></path>
        <path d="M3 0H22.3A7 7 0 0 1 29.3 7V22.3A7 7 0 0 1 22.3 29.3H3A3 3 0 0 1 0 26.3V3A3 3 0 0 1 3 0Z" class="brand-mark-bg"></path>
        <!-- 책등 + 책등 선 -->
        <path d="M3 0H4.6V29.3H3A3 3 0 0 1 0 26.3V3A3 3 0 0 1 3 0Z" class="brand-mark-dark"></path>
        <rect x="5.3" y="0" width="0.7" height="29.3" class="brand-mark-line"></rect>
        <g transform="translate(16 14.65) scale(1.12) translate(-15.6 -15)">
            <circle cx="19.6" cy="7.6" r="2.9" fill="#FFFFFF"></circle>
            <path d="M18.2 11.6 L14.6 17.4 L19.4 19.6 L19.8 24.8 M14.6 17.4 L12.2 21.6 L7.6 22.2" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M11.4 12.8 L14.6 11.6 L18.2 11.6 L21.4 14.4 L24.4 13" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </g>
        <!-- 줄무늬 = 표지색 선을 사람 위에 겹쳐 그림 (속도감, 책등 선 오른쪽부터) -->
        <g clip-path="url(#brand-mark-clip)" class="brand-mark-bg">
            <rect x="6" y="2.25" width="11" height="1"></rect>
            <rect x="6" y="4.75" width="11" height="1"></rect>
            <rect x="6" y="7.25" width="11" height="1"></rect>
            <rect x="6" y="9.75" width="11" height="1"></rect>
            <rect x="6" y="12.25" width="11" height="1"></rect>
            <rect x="6" y="14.75" width="11" height="1"></rect>
            <rect x="6" y="17.25" width="11" height="1"></rect>
            <rect x="6" y="19.75" width="11" height="1"></rect>
            <rect x="6" y="22.25" width="11" height="1"></rect>
            <rect x="6" y="24.75" width="11" height="1"></rect>
            <rect x="6" y="27.25" width="11" height="1"></rect>
        </g>
    </svg>
    <span class="brand-name">VOCARUNNER</span>
</span>

</body>
</html>
