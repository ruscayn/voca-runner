<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f9">
    <title>VocaRunner</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<form class="app" id="start-form" th:action="@{/test/start}" method="post">

    <header class="app-header">
        <h1>VocaRunner</h1>
        <p class="sub">레벨을 선택하세요</p>
    </header>

    <div class="notice" th:if="${message}" th:text="${message}">시험이 종료되었습니다.</div>

    <main class="app-content">
        <fieldset class="level-grid">
            <legend class="sr-only">레벨 선택</legend>
            <label class="level-card" th:each="lv, stat : ${levels}">
                <input type="radio" name="level" th:value="${lv.code()}" th:checked="${stat.first}" required>
                <span class="level-code" th:text="${lv.code()}">A1</span>
                <span class="level-count" th:text="|${#numbers.formatInteger(lv.wordCount(), 1, 'COMMA')} 단어|">1,049 단어</span>
            </label>
        </fieldset>
    </main>

    <footer class="app-footer">
        <p class="info">
            <span th:text="|${questionCount}문항|">500문항</span> ·
            <span th:text="|문제당 ${timeLimitSec}초|">문제당 5초</span>
        </p>
        <p class="info time-info" th:with="m=${allowedSec / 60}, s=${allowedSec % 60}">
            <strong th:text="|${m}분${s != 0 ? ' ' + s + '초' : ''}|">44분 40초</strong> 안에 마쳐야 하며,
            지나면 시험이 무효가 됩니다.
        </p>
        <button type="submit" class="primary-btn" id="start-btn">시험 시작</button>
    </footer>

</form>
<script>
    // 문제 생성 중 중복 클릭 방지
    document.getElementById('start-form').addEventListener('submit', () => {
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        btn.textContent = '문제 만드는 중...';
    });
    // 뒤로가기로 돌아왔을 때(bfcache) 버튼 복구
    window.addEventListener('pageshow', () => {
        const btn = document.getElementById('start-btn');
        btn.disabled = false;
        btn.textContent = '시험 시작';
    });
</script>
</body>
</html>
