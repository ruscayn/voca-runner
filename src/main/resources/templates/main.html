<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: commonHead}"></th:block>
    <title>VocaRunner</title>
</head>
<body>
<form class="app main-app" id="start-form" th:action="@{/test/start}" method="post">

    <header class="app-header main-header">
        <span th:replace="~{fragments/common :: brand}"></span>
        <a class="about-link" th:href="@{/about}">
            정보 · 출처
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 4 L10 8 L6 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
    </header>

    <div class="notice" th:if="${message}" th:text="${message}">시험이 종료되었습니다.</div>
    <!-- 쿠키를 막은 브라우저 (U41). 아래 스크립트가 보인다 -->
    <div class="notice" id="cookie-notice" hidden>쿠키가 꺼져 있어 시험을 볼 수 없습니다. 브라우저 설정에서 쿠키를 켠 뒤 다시 시작해 주세요.</div>

    <main class="app-content">
        <!-- <br> 뒤 빈칸: 안내 띠가 보여 줄바꿈을 숨길 때(main.css U49) 띄어 쓰기 위함. 두 줄일 때는 줄 맨 앞이라 안 보임 -->
        <h1 class="hero">오늘은 어떤 코스를<br> 달려볼까요?</h1>

        <div class="level-groups">
            <fieldset class="level-group" th:each="group, groupStat : ${levelGroups}">
                <legend th:text="${group.name()}">Basic</legend>
                <div class="level-grid">
                    <label class="level-card" th:each="lv, stat : ${group.levels()}">
                        <input type="radio" name="level" required
                               th:value="${lv.code()}"
                               th:attr="data-question-count=${lv.questionCount()},data-allowed-minutes=${lv.allowedMinutes()}"
                               th:checked="${groupStat.first and stat.first}">
                        <span class="level-top">
                            <span class="level-code" th:text="${lv.code()}">A1</span>
                            <span class="level-check">
                                <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 6.2 L5 8.5 L9.5 3.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </span>
                        <span class="level-count" th:text="|${#numbers.formatInteger(lv.wordCount(), 1, 'COMMA')} 단어|">1,049 단어</span>
                    </label>
                </div>
            </fieldset>
        </div>
    </main>

    <footer class="app-footer main-footer">
        <div class="stat-strip">
            <div class="stat">
                <span class="stat-value" id="question-count" th:text="${#numbers.formatInteger(questionCount, 1, 'COMMA')}">500</span>
                <span class="stat-label">문항</span>
            </div>
            <div class="stat">
                <span class="stat-value"><th:block th:text="${timeLimitSec}">5</th:block><span class="stat-unit">초</span></span>
                <span class="stat-label">문제당</span>
            </div>
            <div class="stat">
                <span class="stat-value"><span id="allowed-minutes" th:text="${allowedMinutes}">45</span><span class="stat-unit">분</span></span>
                <span class="stat-label">제한 시간</span>
            </div>
        </div>
        <p class="rule-note">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.2 V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="5" r=".9" fill="currentColor"/></svg>
            <span><span id="allowed-minutes-text" th:text="${allowedMinutes}">45</span>분 안에 제출하지 않으면 무효 처리됩니다.</span>
        </p>
        <button type="submit" class="primary-btn" id="start-btn">
            <span id="start-label">A1 코스 시작</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10 H16 M11 5 L16 10 L11 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </footer>

</form>
<script>
    (() => {
        const form = document.getElementById('start-form');
        const btn = document.getElementById('start-btn');
        const label = document.getElementById('start-label');
        const questionCount = document.getElementById('question-count');
        const allowedMinutes = document.getElementById('allowed-minutes');
        const allowedMinutesText = document.getElementById('allowed-minutes-text');

        // 버튼 문구에 선택한 레벨 표시 (예: B1 코스 시작)
        // 문항 수·제한 시간도 선택한 레벨 기준 (단어가 설정 문항 수보다 적으면 그 레벨 전체)
        function syncLabel() {
            const checked = form.querySelector('input[name="level"]:checked');
            label.textContent = checked ? `${checked.value} 코스 시작` : '코스 시작';
            if (!checked) return;
            questionCount.textContent = Number(checked.dataset.questionCount).toLocaleString('ko-KR');
            allowedMinutes.textContent = checked.dataset.allowedMinutes;
            allowedMinutesText.textContent = checked.dataset.allowedMinutes;
        }
        form.addEventListener('change', syncLabel);

        // 쿠키를 막은 브라우저는 시작해도 시험 화면에 들어갈 수 없다 (입장권·기기 구분이 쿠키).
        // 들어가려다 "이미 시작된 시험입니다"로 돌아오면 이유를 알 수 없으므로 미리 알리고 시작하지 않는다 (U41)
        const cookieNotice = document.getElementById('cookie-notice');
        cookieNotice.hidden = navigator.cookieEnabled;

        // 문제 생성 중 중복 클릭 방지
        form.addEventListener('submit', (e) => {
            if (!navigator.cookieEnabled) {
                e.preventDefault();
                cookieNotice.hidden = false;
                return;
            }
            btn.disabled = true;
            label.textContent = '문제 만드는 중...';
        });

        // 뒤로가기로 돌아왔을 때(bfcache) 버튼 복구
        window.addEventListener('pageshow', () => {
            btn.disabled = false;
            syncLabel();
        });

        syncLabel();
    })();
</script>
</body>
</html>
