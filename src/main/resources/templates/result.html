<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/result.css}">
    <title>시험 결과 - VocaRunner</title>
</head>
<body>
<div class="app">

    <main class="app-content result-content">
        <header class="result-top">
            <span th:replace="~{fragments/common :: brand}"></span>
        </header>

        <!-- 기록 카드 -->
        <section class="record" aria-label="시험 결과">
            <div class="record-head">
                <span class="record-tag">FINISH</span>
                <span class="result-level"><th:block th:text="${result.level()}">B1</th:block> · <th:block th:text="${result.levelGroup()}">Independent</th:block></span>
            </div>
            <p class="record-score"><strong th:text="${result.score()}">82</strong><span>점</span></p>
            <div class="record-bar"><div class="record-bar-fill" th:style="|width: ${result.score()}%|"></div></div>
            <div class="record-stats">
                <div class="record-stat">
                    <span class="record-num" th:text="${result.correctCount()}">410</span>
                    <span class="record-label">정답</span>
                </div>
                <div class="record-stat">
                    <span class="record-num" th:text="${result.wrongCount()}">63</span>
                    <span class="record-label">오답</span>
                </div>
                <div class="record-stat">
                    <span class="record-num" th:text="${result.timeoutCount()}">27</span>
                    <span class="record-label">시간 초과</span>
                </div>
            </div>
        </section>

        <p class="retention-note">이 결과는 제출 후 <th:block th:text="${result.retentionMinutes()}">20</th:block>분 동안만 볼 수 있어요 (<strong th:text="${availableUntil}">14:20</strong>까지)</p>

        <!-- 틀린 단어 -->
        <section class="review-section" th:unless="${#lists.isEmpty(result.wrongItems())}">
            <h2 class="section-title">틀린 단어 <span class="count-badge" th:text="${#lists.size(result.wrongItems())}">90</span></h2>
            <ul class="review">
                <li class="entry" th:each="item : ${result.wrongItems()}" th:id="|q${item.no()}|">
                    <div class="entry-body">
                        <p class="entry-word" lang="en" th:text="${item.prompt()}">abandon</p>
                        <p class="entry-sub" lang="en" th:if="${item.promptSub() != null}" th:text="${item.promptSub()}">for one's sake</p>
                        <p class="entry-line">
                            <span class="entry-label answer">정답</span>
                            <span class="entry-answer" th:text="${item.answerText()}">버리다, 포기하다</span>
                        </p>
                        <p class="entry-line">
                            <span class="entry-label">내 답</span>
                            <span class="entry-mine" th:if="${item.selectedText() != null}" th:text="${item.selectedText()}">채택하다, 입양하다</span>
                            <span class="entry-timeout" th:if="${item.selectedText() == null}">시간 초과</span>
                        </p>
                    </div>
                    <button type="button" class="speak" th:attr="data-word=${item.headword()},aria-label=|${item.headword()} 발음 듣기|">
                        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 8 H6 L10 4.5 V15.5 L6 12 H3 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 7.5 C14.3 8.8 14.3 11.2 13 12.5 M15.5 5.5 C18 8 18 12 15.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                    </button>
                </li>
            </ul>
        </section>

        <div class="perfect" th:if="${#lists.isEmpty(result.wrongItems())}">
            <p class="perfect-title">틀린 단어가 없어요</p>
            <p class="perfect-text">다음 레벨에 도전해 보세요.</p>
        </div>
    </main>

    <footer class="app-footer result-footer">
        <a class="primary-btn" th:href="@{/}">메인으로</a>
    </footer>

</div>
<script>
    // 단어 발음 듣기 (브라우저 내장 TTS)
    (() => {
        const synth = window.speechSynthesis;
        if (!synth) return;
        document.querySelectorAll('.speak').forEach((btn) => {
            btn.addEventListener('click', () => {
                synth.cancel();
                const u = new SpeechSynthesisUtterance(btn.dataset.word);
                u.lang = 'en-US';
                u.rate = 0.9;
                synth.speak(u);
            });
        });
    })();
</script>
</body>
</html>
