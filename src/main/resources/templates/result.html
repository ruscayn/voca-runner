<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f9">
    <title>시험 결과 - My Voca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/result.css}">
</head>
<body>
<div class="app">

    <header class="app-header result-header">
        <div class="score-line">
            <span class="level-tag" th:text="${result.level()}">A1</span>
            <p class="score">
                <strong th:text="${result.correctCount()}">15</strong><span class="score-total" th:text="|/${result.questionCount()}|">/20</span>
            </p>
            <span class="score-point" th:text="|${result.score()}점|">75점</span>
        </div>
    </header>

    <main class="app-content">
        <th:block th:unless="${#lists.isEmpty(result.wrongItems())}">
            <h2 class="section-title" th:text="|다시 볼 단어 ${#lists.size(result.wrongItems())}개|">다시 볼 단어 5개</h2>

            <ul class="review">
                <li class="entry" th:each="item : ${result.wrongItems()}" th:id="|q${item.no()}|">
                    <div class="entry-head">
                        <span class="entry-no" th:text="${item.no()}">3</span>
                        <p class="entry-word" th:text="${item.prompt()}">insistent</p>
                        <button type="button" class="speak" th:attr="data-word=${item.headword()}" aria-label="발음 듣기">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
                        </button>
                    </div>
                    <p class="mine" th:if="${item.selectedText() != null}" th:text="${item.selectedText()}">의상, 복장</p>
                    <p class="mine none" th:if="${item.selectedText() == null}">시간 안에 고르지 못함</p>
                    <p class="fix" th:text="${item.answerText()}">강요하는, 끈질긴</p>
                </li>
            </ul>
        </th:block>

        <div class="perfect" th:if="${#lists.isEmpty(result.wrongItems())}">
            <p class="perfect-title">틀린 단어가 없어요</p>
            <p class="perfect-text">다음 레벨에 도전해 보세요.</p>
        </div>
    </main>

    <footer class="app-footer">
        <a class="primary-btn link-btn" th:href="@{/}">확인</a>
    </footer>

</div>
<script>
    // 단어 발음 듣기 (브라우저 내장 TTS)
    (() => {
        const synth = window.speechSynthesis;
        if (!synth) return;
        document.querySelectorAll('.speak').forEach((btn) => {
            btn.addEventListener('click', () => {
                synth.cancel();
                const u = new SpeechSynthesisUtterance(btn.dataset.word);
                u.lang = 'en-US';
                u.rate = 0.9;
                synth.speak(u);
            });
        });
    })();
</script>
</body>
</html>
