<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: commonHead}"></th:block>
    <title>안내 - VocaRunner</title>
</head>
<body>
<!--
  화면 요청의 오류 안내 (GlobalExceptionHandler, 그 밖에는 Spring Boot 기본 /error 가 이 화면을 쓴다)
  status 만 있어도 보이도록 제목·문구는 상태 코드로 정한다. detail 이 있으면 문구 대신 표시 (업무 오류 안내)
-->
<div class="app" th:with="notFound=${status == 404}, badRequest=${status != null and status >= 400 and status < 500 and status != 404}">

    <header class="app-header">
        <span th:replace="~{fragments/common :: brand}"></span>
    </header>

    <main class="app-content error-content">
        <p class="error-code" th:text="${status}">404</p>
        <h1 class="hero" th:text="${notFound} ? '페이지를 찾을 수 없습니다' : (${badRequest} ? '잘못된 주소입니다' : '일시적인 오류가 발생했습니다')">페이지를 찾을 수 없습니다</h1>
        <p class="error-text" th:text="${detail} ?: (${notFound or badRequest} ? '주소가 맞는지 확인해 주세요.' : '잠시 후 다시 시도해 주세요.')">주소가 맞는지 확인해 주세요.</p>
    </main>

    <footer class="app-footer">
        <a class="primary-btn" th:href="@{/}">메인으로</a>
    </footer>

</div>
</body>
</html>
