<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/exam.css}">
    <title>시험 - VocaRunner</title>
</head>
<body class="exam-page">
<!-- 준비 화면 : 아직 시험이 없다. [시작]을 누르면 exam.js 가 서버에 시험을 만들고(마감도 이때부터) 문항 전달을 요청한다 (P13) -->
<div class="app" id="exam-app"
     th:attr="data-level=${overview.code()},data-group-name=${groupName},data-question-count=${overview.questionCount()},data-time-per-question-sec=${timePerQuestionSec},data-allowed-minutes=${overview.allowedMinutes()}">

    <!-- 처음에는 뒤 화면을 막아 두고 "준비 중..." 안내를 보인다. 느린 인터넷에서 exam.js 가 늦게 실행돼도
         빈 보기 버튼·0 / 0 이 먼저 보이지 않게 (U20). exam.js 가 시작 전 안내로 바꾸고, 문항이 전달되면 막은 것을 푼다 -->
    <header class="app-header exam-header" inert>
        <div class="exam-status">
            <p class="progress-text" aria-live="off">
                <strong id="current-no">0</strong><span class="progress-total">/ <span id="total-count">0</span></span>
            </p>
            <div class="remain-pill" id="remain" aria-label="남은 전체 시간">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8.5" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 5.5 V8.5 L10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span class="remain-time" id="remain-time">--:--</span>
            </div>
        </div>
        <!-- 진행 길 (P5) : 사람이 왼쪽에서 밀고 들어가며 결승선까지 남은 길(색 막대)이 줄어든다.
             색은 100문제마다 한 단계 (exam.css --stage). 사람은 답을 고르면 한 걸음 뛴다 (exam.js runStep) -->
        <div class="run-lane" id="run-lane" aria-hidden="true">
            <div class="run-track"></div>
            <div class="run-rest"></div>
            <div class="runner">
                <svg class="runner-fig" id="runner-fig" viewBox="0 0 24 30" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <g class="rn-body">
                        <g opacity="0.45"><g class="rn-arm rn-arm-far"><path d="M14 9.4 L14 14.2 L17.6 12.2" stroke-width="2.2"/></g><g class="rn-far"><g class="rn-thigh"><path d="M11 16.5 L11 22" stroke-width="2.6"/><g class="rn-shin"><path d="M11 22 L11 27.2 L13.2 27.4" stroke-width="2.4"/></g></g></g></g>
                        <path d="M11 16.5 L14 9.4" stroke-width="2.8"/>
                        <circle cx="15.6" cy="5.8" r="2.6" fill="currentColor" stroke="none"/>
                        <g class="rn-near"><g class="rn-thigh"><path d="M11 16.5 L11 22" stroke-width="2.6"/><g class="rn-shin"><path d="M11 22 L11 27.2 L13.2 27.4" stroke-width="2.4"/></g></g></g>
                        <g class="rn-arm rn-arm-near"><path d="M14 9.4 L14 14.2 L17.6 12.2" stroke-width="2.2"/></g>
                    </g>
                </svg>
            </div>
            <svg class="run-flag" viewBox="0 0 16 20">
                <path d="M2 19 V2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <rect x="2.6" y="2" width="10" height="7" fill="#FFFFFF" stroke="currentColor" stroke-width="1"/>
                <path d="M2.6 2 h2.5 v2.33 h-2.5 Z M7.6 2 h2.5 v2.33 h-2.5 Z M5.1 4.33 h2.5 v2.33 h-2.5 Z M10.1 4.33 h2.5 v2.33 h-2.5 Z M2.6 6.66 h2.5 v2.33 h-2.5 Z M7.6 6.66 h2.5 v2.33 h-2.5 Z" fill="currentColor"/>
            </svg>
        </div>
    </header>

    <main class="app-content exam-content" inert>
        <p class="prompt" id="prompt" lang="en"></p>
        <p class="prompt-sub" id="prompt-sub" lang="en" hidden></p>
    </main>

    <div class="q-timer" aria-label="이 문제의 남은 시간" inert>
        <div class="q-timer-track"><div class="q-timer-bar" id="timer-bar"></div></div>
        <p class="q-timer-sec"><span id="timer-sec">5</span><span class="q-timer-unit">초</span></p>
    </div>

    <footer class="app-footer exam-footer" inert>
        <div class="options" id="options">
            <button type="button" class="option-btn" data-no="1"><span class="option-no">1</span><span class="option-text"></span></button>
            <button type="button" class="option-btn" data-no="2"><span class="option-no">2</span><span class="option-text"></span></button>
            <button type="button" class="option-btn" data-no="3"><span class="option-no">3</span><span class="option-text"></span></button>
            <button type="button" class="option-btn" data-no="4"><span class="option-no">4</span><span class="option-text"></span></button>
        </div>
        <p class="level-caption" id="level-caption"></p>
    </footer>

    <!-- 안내 시트 (시작 전 / 채점 중 / 종료·오류) -->
    <div class="sheet-backdrop" id="overlay">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
            <!-- 안내 글. 안내창이 화면보다 높으면(가로 화면 + 큰 글자) 이 부분만 스크롤하고 아래 버튼 줄은 늘 보인다 (U46) -->
            <div class="sheet-body">
                <p class="sheet-eyebrow" id="sheet-eyebrow" hidden></p>
                <h2 class="sheet-title" id="overlay-title">준비 중...</h2>
                <p class="sheet-text" id="overlay-text"></p>
                <!-- 자바스크립트를 끈 브라우저 : "준비 중..." 대신 켜 달라는 안내 (U36). 아직 시험을 만들지 않았으므로 서버에 남는 것은 없다 -->
                <noscript>
                    <style>#overlay-title { display: none; }</style>
                    <p class="sheet-text">자바스크립트가 꺼져 있어 시험을 볼 수 없습니다.<br>브라우저 설정에서 자바스크립트를 켠 뒤 다시 시작해 주세요.</p>
                </noscript>

                <div class="ready-info" id="ready-info" hidden>
                    <div class="stat-strip ready-stats">
                        <div class="stat">
                            <span class="stat-value" id="ready-count">500</span>
                            <span class="stat-label">문항</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value"><span id="ready-sec">5</span><span class="stat-unit">초</span></span>
                            <span class="stat-label">문제당</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value"><span id="ready-min">45</span><span class="stat-unit">분</span></span>
                            <span class="stat-label">제한 시간</span>
                        </div>
                    </div>
                    <ul class="rules">
                        <li>
                            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10.5" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5 V10.5 L12.5 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                            <span><strong><span id="ready-min-text">45</span>분</strong> 안에 제출하지 않으면 무효 처리됩니다.</span>
                        </li>
                        <!-- 발음이 되는 브라우저에서만 보임 (U22, exam.js tts.available).
                             [소리 확인] : 영어를 30초 동안 읽어 그동안 휴대폰 볼륨을 맞추게 한다 (U51, exam.js soundCheck) -->
                        <li id="ready-sound" hidden>
                            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 8 H6 L10 4.5 V15.5 L6 12 H3 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 7.5 C14.3 8.8 14.3 11.2 13 12.5 M15.5 5.5 C18 8 18 12 15.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                            <div class="sound-check">
                                <span>단어마다 발음이 함께 나옵니다.<br>[소리 확인]을 누르고, 소리가 나는 동안 휴대폰 볼륨을 맞춰 주세요.</span>
                                <button type="button" class="sound-check-btn" id="sound-check">소리 확인</button>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="sheet-actions">
                <button type="button" class="secondary-btn" id="overlay-back" hidden>이전</button>
                <button type="button" class="primary-btn" id="overlay-btn" hidden>확인</button>
            </div>
        </section>
    </div>

</div>
<script th:src="@{/js/exam.js}"></script>
</body>
</html>
