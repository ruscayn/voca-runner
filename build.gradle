plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.ruscayn'
version = '1.0.1'
description = 'voca-runner'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 코드 스타일 검사 (우테코 자바 스타일, 규칙은 config/checkstyle/checkstyle.xml). check · build 때 main · test 소스를 검사하고
// 위반이 하나라도 있으면 실패
checkstyle {
    toolVersion = '14.3.0'
    maxWarnings = 0
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web / View
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Data
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // AWS: 운영(prod 프로필)에서 시작할 때 SSM Parameter Store 의 비밀 값(DB 계정·CloudFront 비밀 헤더)을 설정으로 읽음
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.2.1')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Development Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test (Boot 4: 기술별 test starter, spring-boot-starter-test 자동 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // DB 테스트용 임시 PostgreSQL (테스트 실행 중에만 Docker 로 띄우고 끝나면 지움. Docker 가 켜져 있어야 함)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // 구조 검사 (계층 · 기능 간 의존 방향을 테스트로 고정)
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
